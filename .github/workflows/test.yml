name: Unit Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon:
          - script.akasha.aura
          - script.akasha.ambient
          - service.akasha.remote
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests (${{ matrix.addon }})
        working-directory: kodi/addons/${{ matrix.addon }}
        run: |
          PYTHONPATH=resources/lib python3 -m unittest discover -v tests
