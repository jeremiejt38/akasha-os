# Akasha OS — static host pins appended to /etc/hosts by LibreELEC
# (/storage/.config/hosts.conf is applied at boot; install.sh also appends
# it live so no reboot is needed).
#
# plex.akasha.ing / connector.akasha.ing: the router's RDNSS advertises a
# dead resolver (fd0f:ee:b0::1, a leftover Tailscale MagicDNS address) that
# costs a ~5 s timeout on EVERY DNS lookup before the fallback answers.
# With the endpoints behind Cloudflare, every Aura fetch paid that tax;
# pinning the full advertised address set here bypasses the dead resolver
# entirely. If Cloudflare ever rotates the zone's IPs, redeploy
# (scripts/apply.sh) refreshes this file.
104.21.21.102 plex.akasha.ing
172.67.197.240 plex.akasha.ing
2606:4700:3032::6815:1566 plex.akasha.ing
2606:4700:3033::ac43:c5f0 plex.akasha.ing
104.21.21.102 connector.akasha.ing
172.67.197.240 connector.akasha.ing
